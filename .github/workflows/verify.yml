name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Build and browser contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The scripts/ pipeline is type-checked under strict mypy, and `npm run
      # verify` now runs it. BOTH requirement files are needed: requirements.txt
      # so mypy can import the libraries and read their inline hints, and
      # requirements-dev.txt for mypy itself plus the stub packages. Installing
      # only the latter makes every `import numpy` unresolvable and the gate
      # passes without checking anything.
      #
      # They live in scripts/, NOT the repo root, and that location is load-
      # bearing: Vercel autodetects a root requirements.txt and starts a Python
      # build, which fails on a cmake dependency and breaks the preview deploy
      # (the site build is Node-only). Keeping them one directory down satisfies
      # both -- do not move them back up.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt -r scripts/requirements-dev.txt

      - name: Verify build and publication contracts
        run: npm run verify

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser contracts
        # `verify` built and audited dist above. Exercise that exact artifact
        # instead of silently replacing it with a second production build.
        run: npm run test:e2e:built

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
