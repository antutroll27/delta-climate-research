name: Verify

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a pull request supersedes the run for the older one. Runs on main are never
# cancelled: each one is the only check of that merge.
concurrency:
  group: verify-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# pull-requests: read is for listing a pull request's changed files (the scope step).
permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    name: Build and browser contracts
    runs-on: ubuntu-latest
    # Measured 2026-09-05: this job has taken 17.5-20.0 min on every push to main since
    # 0355181 (e2e on SwiftShader is the bulk), so 20 had no headroom and the run for
    # c2b7bbb was cancelled at 21.8 min once test:py grew by the tree-shading self-check.
    # 30 is a ceiling against a hung step, not a budget.
    # 2026-09-06: the verify step ran 26.6 min on 2a35c56 (two flaky retries, ~6 min, plus the solar specs, ~3 min); 40 keeps it a ceiling.
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Measured 2026-10-12: 65 runs and 1,958 minutes in 30 days, of which 789 were the full
      # suite running a second time on main straight after it passed on the pull request, and
      # 200 were documents-only changes. A private repository gets 2,000 minutes a month and is
      # blocked when they run out, so the browser contracts (the bulk of a 29-minute run) now
      # run only where they add coverage: on a pull request that changes something the site is
      # built from. Everything else in `verify` still runs every time, on main included, because
      # unit tests read docs/ and a merge can break against newer work on main.
      # The site build reads nothing under docs/ and no .md file (checked the same day).
      # Fails OPEN: if the changed files cannot be listed, the browser contracts run.
      - name: Decide whether the browser contracts run
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          browser=true
          changed="$RUNNER_TEMP/changed.txt"
          if [ "$EVENT" != "pull_request" ]; then
            browser=false
          elif ! gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate \
              -q '.[] | .filename, (.previous_filename // empty)' > "$changed"; then
            echo "Could not list the changed files; running the browser contracts."
          elif [ -s "$changed" ] && ! grep -qvE '^docs/|\.md$' "$changed"; then
            browser=false
          fi
          echo "browser=$browser" | tee -a "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The scripts/ pipeline is type-checked under strict mypy, and `npm run
      # verify` now runs it. BOTH requirement files are needed: requirements.txt
      # so mypy can import the libraries and read their inline hints, and
      # requirements-dev.txt for mypy itself plus the stub packages. Installing
      # only the latter makes every `import numpy` unresolvable and the gate
      # passes without checking anything.
      #
      # They live in scripts/, NOT the repo root, and that location is load-
      # bearing: Vercel autodetects a root requirements.txt and starts a Python
      # build, which fails on a cmake dependency and breaks the preview deploy
      # (the site build is Node-only). Keeping them one directory down satisfies
      # both -- do not move them back up.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt -r scripts/requirements-dev.txt

      # Chromium BEFORE verify, not after: `verify` ends with test:e2e:built, so
      # installing the browser afterwards meant the gate could never pass. It went
      # unnoticed because verify always died earlier, on a Python import, until the
      # step above started installing numpy.
      # Browser binary is cached; only the download is version-dependent, so key
      # on the lockfile. A cache hit turns the step below into a no-op.
      - name: Cache Playwright browsers
        if: steps.scope.outputs.browser == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      # SPLIT FROM THE BROWSER INSTALL, and best-effort, because `--with-deps`
      # runs `apt-get update` and that is what actually broke CI. On 2026-08-19
      # three consecutive runs died at exactly 20 minutes -- the job cap, which
      # GitHub reports as "cancelled" rather than "failed", so it read as a fluke.
      # The log ends mid-`apt-get update` at archive.ubuntu.com and resumes only
      # at the kill 18.5 minutes later, with the azure.archive mirror already
      # failing over (`Ign:` lines). The same step took 56s on the last green run.
      # Nothing in this repo changed; an Ubuntu mirror stalled.
      #
      # So apt is now bounded and non-fatal: if the mirrors are healthy we get the
      # system libraries as before, and if they hang we lose four minutes instead
      # of the entire budget. Should a library genuinely be missing, Chromium
      # fails to launch and the e2e contracts say so loudly — a real failure being
      # far more useful than a timeout that never reaches the tests at all.
      # ONE apt invocation for both engines, deliberately. Two separate install-deps steps
      # raced for the apt lock — the second died instantly with "Could not get lock
      # /var/lib/apt/lists/lock, held by process 240", continue-on-error swallowed it, and every
      # WebKit test then failed at browserType.launch. The libraries were never the problem the
      # second time; the second apt call was.
      - name: Install Chromium system libraries (best effort)
        if: steps.scope.outputs.browser == 'true'
        timeout-minutes: 4
        continue-on-error: true
        run: npx playwright install-deps chromium

      - name: Install Chromium
        if: steps.scope.outputs.browser == 'true'
        timeout-minutes: 6
        run: npx playwright install chromium

      # Firefox and WebKit run the CBAM calculator only (see playwright.config.ts): it is the one
      # surface here a customs consultant might open in Safari, and WebKit is the engine most
      # likely to disagree about print CSS and date inputs, both of which that page leans on.
      # It has already earned the slot — it caught a mega-menu bug Chromium could not see.
      - name: Install Firefox
        if: steps.scope.outputs.browser == 'true'
        timeout-minutes: 6
        run: npx playwright install firefox

      # Runs the browser contracts too, as its last stage, against the dist it
      # just built and audited -- which is what the removed "Run browser
      # contracts" step existed to do. Keeping both ran the whole e2e suite twice
      # per CI run for no added coverage.
      # `verify` is `verify:static` followed by the browser contracts.
      - name: Verify build, publication and browser contracts
        run: npm run ${{ steps.scope.outputs.browser == 'true' && 'verify' || 'verify:static' }}

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
