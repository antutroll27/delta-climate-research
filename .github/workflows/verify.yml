name: Verify

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a pull request supersedes the run for the older one. Runs on main are never
# cancelled: each one is the only check of that merge.
concurrency:
  group: verify-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# pull-requests: read is for listing a pull request's changed files (the scope step).
permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    name: Build and browser contracts (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    # PR #62: with v2 the default, its full-bleed map makes the tier-0 specs ~1.5x slower on the 2-CPU runner,
    # and the main scope ran past its 38-minute stop (178 passed, 23 never ran). Split in two by test with
    # --shard, as the v2 job is. ponytail: each leg repeats verify:static (~10 min); split it out if minutes matter.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # Measured 2026-09-05: this job has taken 17.5-20.0 min on every push to main since
    # 0355181 (e2e on SwiftShader is the bulk), so 20 had no headroom and the run for
    # c2b7bbb was cancelled at 21.8 min once test:py grew by the tree-shading self-check.
    # 30 is a ceiling against a hung step, not a budget.
    # 2026-09-06: the verify step ran 26.6 min on 2a35c56 (two flaky retries, ~6 min, plus the solar specs, ~3 min); 40 keeps it a ceiling.
    # 2026-10-13: it stopped being only a ceiling. Six runs between 10-07 and 10-12 were cancelled
    # here with the browser contracts still running (five of them while it was dawn or dusk in
    # Kolkata: the heat map repainted without rest in "Now", fixed the same day). The limit is
    # unchanged; playwright.config.ts now sets a `globalTimeout` of 33 min in CI so that an
    # overrun on a runner with quick setup ends as a failure with a summary instead of a
    # cancellation with nothing. Measured: the runner ends the job 38.8-39.0 min after its first
    # log line, and setup plus the static checks take 3.1-6.2 of that.
    # 2026-10-14: 40 -> 50, with Playwright's `globalTimeout` going 33 -> 40 in the same change.
    # Measured on run 38448354814 (13 Oct): the job took 34.6 min, of which the browser
    # contracts were 28.7 (197 tests, no retries); the day before, the same suite took 23.7.
    # That left 4.3 min under the 33-minute stop and about 4 under this limit, before the CBAM
    # tests that this change and the next add. A 50-minute job is ended at about 48.8; less
    # 6.2 for the slowest setup leaves 42.6, so the 40-minute stop in playwright.config.ts
    # fires first with 2.6 min to print its summary and upload. The arithmetic is spelt out
    # there. This is still a ceiling, and it costs nothing unless a run is slow: a job is
    # billed for the minutes it uses, about 35 for a full pull-request run today.
    # Corrected later the same day: the 6.2 was out of date. Run 38464957721 spent 7.8 min
    # outside the browser tests (job 38.65 min, browser tests 30.8) and would have been cancelled
    # under the old 40. On 7.8, a 40-minute stop left 1.0 min to report, so the stop is now 38:
    # 48.8 - 7.8 - 38 = 3.0. A full pull-request run has cost 25 to 39 billed minutes this week,
    # depending on the runner (24.5 and 38.65 for two runs started six minutes apart).
    timeout-minutes: 50

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Measured 2026-10-12: 65 runs and 1,958 minutes in 30 days, of which 789 were the full
      # suite running a second time on main straight after it passed on the pull request, and
      # 200 were documents-only changes. A private repository gets 2,000 minutes a month and is
      # blocked when they run out, so the browser contracts (the bulk of a 29-minute run) now
      # run only where they add coverage: on a pull request that changes something the site is
      # built from. Everything else in `verify` still runs every time, on main included, because
      # unit tests read docs/ and a merge can break against newer work on main.
      # The site build reads nothing under docs/ and no .md file (checked the same day).
      # Fails OPEN: if the changed files cannot be listed, the browser contracts run.
      - name: Decide whether the browser contracts run
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          browser=true
          changed="$RUNNER_TEMP/changed.txt"
          if [ "$EVENT" != "pull_request" ]; then
            browser=false
          elif ! gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate \
              -q '.[] | .filename, (.previous_filename // empty)' > "$changed"; then
            echo "Could not list the changed files; running the browser contracts."
          elif [ -s "$changed" ] && ! grep -qvE '^docs/|\.md$' "$changed"; then
            browser=false
          fi
          echo "browser=$browser" | tee -a "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The scripts/ pipeline is type-checked under strict mypy, and `npm run
      # verify` now runs it. BOTH requirement files are needed: requirements.txt
      # so mypy can import the libraries and read their inline hints, and
      # requirements-dev.txt for mypy itself plus the stub packages. Installing
      # only the latter makes every `import numpy` unresolvable and the gate
      # passes without checking anything.
      #
      # They live in scripts/, NOT the repo root, and that location is load-
      # bearing: Vercel autodetects a root requirements.txt and starts a Python
      # build, which fails on a cmake dependency and breaks the preview deploy
      # (the site build is Node-only). Keeping them one directory down satisfies
      # both -- do not move them back up.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt -r scripts/requirements-dev.txt

      # Chromium BEFORE verify, not after: `verify` ends with test:e2e:built, so
      # installing the browser afterwards meant the gate could never pass. It went
      # unnoticed because verify always died earlier, on a Python import, until the
      # step above started installing numpy.
      # Browser binary is cached; only the download is version-dependent, so key
      # on the lockfile. A cache hit turns the step below into a no-op.
      - name: Cache Playwright browsers
        if: steps.scope.outputs.browser == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      # SPLIT FROM THE BROWSER INSTALL, and best-effort, because `--with-deps`
      # runs `apt-get update` and that is what actually broke CI. On 2026-08-19
      # three consecutive runs died at exactly 20 minutes -- the job cap, which
      # GitHub reports as "cancelled" rather than "failed", so it read as a fluke.
      # The log ends mid-`apt-get update` at archive.ubuntu.com and resumes only
      # at the kill 18.5 minutes later, with the azure.archive mirror already
      # failing over (`Ign:` lines). The same step took 56s on the last green run.
      # Nothing in this repo changed; an Ubuntu mirror stalled.
      #
      # So apt is now bounded and non-fatal: if the mirrors are healthy we get the
      # system libraries as before, and if they hang we lose four minutes instead
      # of the entire budget. Should a library genuinely be missing, Chromium
      # fails to launch and the e2e contracts say so loudly — a real failure being
      # far more useful than a timeout that never reaches the tests at all.
      # ONE apt invocation for both engines, deliberately. Two separate install-deps steps
      # raced for the apt lock — the second died instantly with "Could not get lock
      # /var/lib/apt/lists/lock, held by process 240", continue-on-error swallowed it, and every
      # WebKit test then failed at browserType.launch. The libraries were never the problem the
      # second time; the second apt call was.
      - name: Install Chromium system libraries (best effort)
        if: steps.scope.outputs.browser == 'true'
        timeout-minutes: 4
        continue-on-error: true
        run: npx playwright install-deps chromium

      - name: Install Chromium
        if: steps.scope.outputs.browser == 'true'
        timeout-minutes: 6
        run: npx playwright install chromium

      # Firefox and WebKit run the CBAM calculator only (see playwright.config.ts): it is the one
      # surface here a customs consultant might open in Safari, and WebKit is the engine most
      # likely to disagree about print CSS and date inputs, both of which that page leans on.
      # It has already earned the slot — it caught a mega-menu bug Chromium could not see.
      - name: Install Firefox
        if: steps.scope.outputs.browser == 'true'
        timeout-minutes: 6
        run: npx playwright install firefox

      # Runs the browser contracts too, as its last stage, against the dist it
      # just built and audited -- which is what the removed "Run browser
      # contracts" step existed to do. Keeping both ran the whole e2e suite twice
      # per CI run for no added coverage.
      # `verify` is `verify:static` followed by the browser contracts.
      # In CI the browser contracts print one line per test with its duration (the `list`
      # reporter beside `github`; see playwright.config.ts), so this step's log says where the
      # time went even when the run is cancelled before its summary.
      # OBOS_PW_SCOPE=main: this job runs every Playwright project EXCEPT the two @v2 parts, which have
      # their own job below (FINAL audit F1, founder-approved 19 Oct). See playwright.config.ts.
      - name: Verify build, publication and browser contracts
        env:
          OBOS_PW_SCOPE: main
          BROWSER: ${{ steps.scope.outputs.browser }}
          SHARD: ${{ matrix.shard }}
        run: |
          npm run verify:static
          if [ "$BROWSER" = true ]; then npx playwright test --shard="$SHARD/2"; fi

      # ON SUCCESS TOO (it was `if: failure()`), for one file: test-results/durations.json, the
      # json reporter's record of how long every test took. A passing run is the baseline a slow
      # one is compared with, and until now passing runs left none. `always()` rather than
      # `!cancelled()`: if a cancelled job is still given this step, the traces it has are worth
      # having (not yet observed either way on a job stopped at its limit).
      # It stays small: traces are still recorded only on a test's first retry
      # (`trace: 'on-first-retry'`), so a clean pass uploads the json and the few screenshots
      # specs save for themselves, well under a megabyte; a failing run uploads what it always
      # did. When the browser contracts did not run there is no directory and nothing is uploaded.
      # Seven days, as before: these are for diagnosing the run in front of you, not an archive.
      - name: Upload browser results and durations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-main-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # THE OBOS v2 BROWSER SUITE, in its own job (FINAL audit F1, founder-approved 19 Oct 2026).
  # The @v2 specs add about 18.5 CI-minutes (127 tests; 12.3 min on the dev machine, ~1.5x on the 2-CPU runner) to the ~28.7 the other
  # browser contracts already take, which does not fit the 38-minute Playwright stop in playwright.config.ts (28.7 + 18.5 = 47.2). Two
  # matrix legs (part a: shell, building, honesty, a11y; part b: compare, solar, air-weather, methods, phone, states, contrast, boot, merged,
  # keyboard; tests/e2e/fixtures/v2-split.ts) run in parallel (measured on PR #62: ~33-37 CI-minutes of tests each, not 9-10, so each part is split into two --shard legs of ~17-19), so the 38-minute stop is kept as it is. It runs
  # only when the existing job's browser contracts run (the same changed-files rule), and installs Chromium only (no Firefox, no WebKit).
  obos-v2-browser:
    name: OBOS v2 browser contracts (part ${{ matrix.part }}, shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    # 40, with Playwright's own stop at 30 below (setup before it has taken up to ~8 minutes on slow runners, so 30 + 8 + upload needs the headroom). PR #62's first run (one leg per part, 25-minute stop) timed out at 1500 s in BOTH parts: part a had run 49 of 75 tests, part b 60 of 93, i.e.
    # ~37 and ~33 CI-minutes of tests, far over the 9-10 estimated at S8 (the on-map card specs and the runner's speed). Each part is therefore split in two with Playwright's --shard
    # (by test, so the halves are even): 4 legs of ~17-19 minutes of tests plus ~5 of setup.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        part: [a, b]
        shard: [1, 2]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The same rule as the `quality` job's scope step: pull requests that change something the site is built from only; main never (the PR
      # already ran it). Fails OPEN: if the changed files cannot be listed, the suite runs.
      - name: Decide whether the browser contracts run
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          browser=true
          changed="$RUNNER_TEMP/changed.txt"
          if [ "$EVENT" != "pull_request" ]; then
            browser=false
          elif ! gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate \
              -q '.[] | .filename, (.previous_filename // empty)' > "$changed"; then
            echo "Could not list the changed files; running the browser contracts."
          elif [ -s "$changed" ] && ! grep -qvE '^docs/|\.md$' "$changed"; then
            browser=false
          fi
          echo "browser=$browser" | tee -a "$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.scope.outputs.browser == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.browser == 'true'
        run: npm ci

      - name: Cache Playwright browsers
        if: steps.scope.outputs.browser == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      # Best effort and bounded, for the reason spelt out in the `quality` job (an apt mirror stall once cost three runs their whole budget).
      - name: Install Chromium system libraries (best effort)
        if: steps.scope.outputs.browser == 'true'
        timeout-minutes: 4
        continue-on-error: true
        run: npx playwright install-deps chromium

      - name: Install Chromium
        if: steps.scope.outputs.browser == 'true'
        timeout-minutes: 6
        run: npx playwright install chromium

      # The browser contracts serve the exact static output that ships (playwright.config.ts webServer), so the site is built first.
      - name: Build
        if: steps.scope.outputs.browser == 'true'
        run: npm run build

      # --global-timeout (30 min) overrides the config's CI 38: Playwright stops itself 5 minutes before this job's 40-minute limit, so a hang ends as a failure with a summary and durations, not a bare cancellation (rc1 R4).
      - name: OBOS v2 browser contracts, part ${{ matrix.part }}, shard ${{ matrix.shard }}/2
        if: steps.scope.outputs.browser == 'true'
        env:
          OBOS_PW_SCOPE: v2-${{ matrix.part }}
        run: npx playwright test --project=chromium-v2-${{ matrix.part }} --shard=${{ matrix.shard }}/2 --global-timeout=1800000

      # test-results/durations.json (the json reporter's record) on passing runs too, as in `quality`: one artifact per part.
      - name: Upload browser results and durations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-v2-${{ matrix.part }}-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
