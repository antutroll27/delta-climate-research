<!doctype html>
<html lang="en" data-ui="v2">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>City loader harness (dev only)</title>
<style>
  html, body { margin: 0; height: 100%; }
  .obos-v2 { position: fixed; inset: 0; overflow: hidden; background: var(--card); color: var(--ink-1); font: 400 15px/1.45 var(--sans); }
  #mlmap { position: absolute; inset: 0; }
  #mlmap canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .bench { position: absolute; z-index: 90; right: 12px; top: 12px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 60%; }
  .bench button { font: 500 12px var(--sans); border-radius: 8px; border: 1px solid var(--plate-line); background: var(--plate); color: var(--plate-ink-1); padding: 6px 10px; min-height: 32px; cursor: pointer; }
  .bench[hidden] { display: none; }
</style>
</head>
<body>
<div class="obos-v2" data-theme="dark" data-cards="plates" id="root">
  <div id="mlmap"><canvas id="mock"></canvas></div>
  <div class="bench" id="bench" hidden></div>
</div>
<script type="module" src="./main.ts"></script>
</body>
</html>
