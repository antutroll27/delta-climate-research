# Installed by setup.sh as /etc/systemd/system.conf.d/obos-india-watchdog.conf.
# systemd feeds the Pi's hardware watchdog (bcm2835: 15 s at most); if the
# system hangs, the watchdog reboots it. A drop-in, because newer Raspberry Pi
# OS images ship no /etc/systemd/system.conf to edit.
[Manager]
RuntimeWatchdogSec=15
