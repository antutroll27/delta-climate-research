<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Heat-map P2–P7 approval preview</title>
    <link rel="icon" href="../../public/favicon.svg" />
    <style>
      @font-face {
        font-family: "Mona";
        src: url("../../public/fonts/MonaSans-Variable.woff2") format("woff2");
        font-display: swap;
      }

      @font-face {
        font-family: "Noplato";
        src: url("../../public/fonts/noplato-mono-condensed.woff2") format("woff2");
        font-display: swap;
      }

      :root {
        color-scheme: dark;
        --base: #050707;
        --surface: #0b1516;
        --surface-2: #102224;
        --paper: #edf0ee;
        --muted: #91a3a2;
        --line: rgb(111 202 214 / 0.18);
        --cyan: #6fcad6;
        --bronze: #b08d57;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        margin: 0;
        background:
          radial-gradient(circle at 80% -10%, rgb(111 202 214 / 0.09), transparent 32rem),
          var(--base);
        color: var(--paper);
        font-family: "Mona", system-ui, sans-serif;
      }

      button,
      a {
        font: inherit;
      }

      .review {
        min-height: 100dvh;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      .review-bar {
        position: sticky;
        top: 0;
        z-index: 5;
        display: grid;
        grid-template-columns: minmax(16rem, 1fr) auto auto;
        align-items: center;
        gap: 1rem;
        min-height: 5.25rem;
        padding: 0.85rem clamp(1rem, 3vw, 2rem);
        border-bottom: 1px solid var(--line);
        background: rgb(5 7 7 / 0.94);
        backdrop-filter: blur(18px);
      }

      .identity {
        min-width: 0;
      }

      .eyebrow {
        margin: 0 0 0.22rem;
        color: var(--cyan);
        font-family: "Noplato", ui-monospace, monospace;
        font-size: 0.64rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(1rem, 2vw, 1.35rem);
        letter-spacing: -0.025em;
      }

      .prototype-note {
        margin: 0.25rem 0 0;
        color: var(--muted);
        font-size: 0.72rem;
      }

      .control-group {
        display: flex;
        align-items: center;
        gap: 0.25rem;
        padding: 0.25rem;
        border: 1px solid var(--line);
        border-radius: 0.65rem;
        background: var(--surface);
      }

      .control-group button {
        min-height: 2.6rem;
        padding: 0 0.85rem;
        border: 0;
        border-radius: 0.45rem;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-family: "Noplato", ui-monospace, monospace;
        font-size: 0.67rem;
        letter-spacing: 0.06em;
      }

      .control-group button:hover {
        color: var(--paper);
      }

      .control-group button[aria-pressed="true"] {
        background: var(--surface-2);
        color: var(--paper);
        box-shadow: inset 0 0 0 1px rgb(111 202 214 / 0.22);
      }

      button:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--cyan);
        outline-offset: 3px;
      }

      .open-tab {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        padding: 0 1rem;
        border: 1px solid rgb(176 141 87 / 0.55);
        border-radius: 0.55rem;
        color: var(--paper);
        text-decoration: none;
        font-family: "Noplato", ui-monospace, monospace;
        font-size: 0.68rem;
        letter-spacing: 0.08em;
      }

      .open-tab:hover {
        background: rgb(176 141 87 / 0.13);
      }

      .canvas-wrap {
        min-width: 0;
        display: grid;
        place-items: start center;
        padding: clamp(1rem, 3vw, 2rem);
        overflow: auto;
      }

      .device {
        position: relative;
        width: min(100%, 1440px);
        height: calc(100dvh - 8rem);
        min-height: 44rem;
        overflow: hidden;
        border: 1px solid rgb(111 202 214 / 0.22);
        border-radius: 1.1rem;
        background: #050606;
        box-shadow: 0 2.5rem 7rem rgb(0 0 0 / 0.48);
        transition:
          width 260ms cubic-bezier(0.22, 1, 0.36, 1),
          height 260ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      .device::before {
        content: attr(data-device-label);
        position: absolute;
        top: 0.75rem;
        left: 50%;
        z-index: 2;
        translate: -50% 0;
        padding: 0.3rem 0.55rem;
        border-radius: 999px;
        background: rgb(5 7 7 / 0.72);
        color: #a6b7b5;
        font-family: "Noplato", ui-monospace, monospace;
        font-size: 0.55rem;
        letter-spacing: 0.12em;
        pointer-events: none;
        opacity: 0;
      }

      .device[data-device="mobile"],
      .device[data-device="zoom"] {
        width: 390px;
        height: 844px;
        min-height: 0;
        border-radius: 1.8rem;
      }

      .device[data-device="mobile"]::before,
      .device[data-device="zoom"]::before {
        opacity: 1;
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #050606;
      }

      @media (max-width: 960px) {
        .review-bar {
          position: relative;
          grid-template-columns: 1fr;
        }

        .control-group {
          overflow-x: auto;
        }

        .control-group button {
          flex: 0 0 auto;
        }

        .open-tab {
          justify-self: start;
        }

        .canvas-wrap {
          place-items: start center;
        }
      }

      @media (max-width: 440px) {
        .canvas-wrap {
          padding: 0;
        }

        .device[data-device="mobile"],
        .device[data-device="zoom"] {
          width: 100%;
          border: 0;
          border-radius: 0;
        }
      }
    </style>
  </head>
  <body>
    <main class="review">
      <header class="review-bar">
        <div class="identity">
          <p class="eyebrow">Approval prototype · P2–P5 + P7 · comparison R&amp;D</p>
          <h1>Urban Heat Explorer interface directions</h1>
          <p class="prototype-note">Synthetic values. Production engine and P6 loading strategy are untouched.</p>
        </div>

        <div class="control-group" aria-label="Preview concept">
          <button type="button" data-preview="field-instrument.html" aria-pressed="true">Field instrument</button>
          <button type="button" data-preview="paired-bench.html" aria-pressed="false">Paired bench</button>
          <button type="button" data-preview="research-console.html" aria-pressed="false">Research fallback</button>
          <button type="button" data-preview="scenario-brief.html" aria-pressed="false">Scenario brief</button>
        </div>

        <div style="display:flex; align-items:center; gap:.65rem; flex-wrap:wrap">
          <div class="control-group" aria-label="Preview viewport">
            <button type="button" data-device="desktop" aria-pressed="true">Desktop</button>
            <button type="button" data-device="mobile" aria-pressed="false">390px</button>
            <button type="button" data-device="zoom" aria-pressed="false">200% text</button>
          </div>
          <div class="control-group" aria-label="Mobile sheet state">
            <button type="button" data-sheet="collapsed" aria-pressed="true">Collapsed</button>
            <button type="button" data-sheet="half" aria-pressed="false">Half</button>
            <button type="button" data-sheet="full" aria-pressed="false">Full</button>
          </div>
          <a class="open-tab" id="open-tab" href="field-instrument.html" target="_blank" rel="noreferrer">Open full tab ↗</a>
        </div>
      </header>

      <section class="canvas-wrap" aria-label="Interactive preview canvas">
        <div class="device" id="device" data-device="desktop" data-device-label="390 × 844">
          <iframe id="preview-frame" src="field-instrument.html" title="Heat-map interface preview"></iframe>
        </div>
      </section>
    </main>

    <script src="review.js"></script>
  </body>
</html>
