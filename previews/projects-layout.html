<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Projects layout — alignment & sizing options</title>
<style>
  :root {
    --color-base: #050606; --color-surface: #0b2c2e; --color-hairline: rgb(111 202 214 / 0.14);
    --color-paper: #ecedf0; --color-ink-muted: #8fa3a5; --color-ink-faint: #5c7173;
    --color-cyan: #6fcad6; --color-cyan-muted: #92c2cb; --color-bronze: #b08d57;
    --font-sans: ui-sans-serif, system-ui, sans-serif; --font-mono: ui-monospace, "SF Mono", monospace;
    --space-gutter: clamp(1rem, 4vw, 2.5rem);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--color-base); color: var(--color-paper); font-family: var(--font-sans); }
  .wrap { max-width: 1400px; margin-inline: auto; padding-inline: var(--space-gutter); }

  /* a faint guide marking the .wrap content edges (the "alignment reference") */
  .guide { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .guide .col { max-width: 1400px; height: 100%; margin-inline: auto; padding-inline: var(--space-gutter); }
  .guide .col > div { height: 100%; border-left: 1px dashed rgb(176 141 87 / 0.45); border-right: 1px dashed rgb(176 141 87 / 0.45); }
  .guide-label { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); font-family: var(--font-mono); font-size: 11px; color: var(--color-bronze); z-index: 6; letter-spacing: .1em; }

  .section { padding-block: 4rem; position: relative; border-top: 1px solid var(--color-hairline); }
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 1.5rem; margin-bottom: 2.5rem; }
  .sec-index { font-family: var(--font-mono); font-size: 1.1rem; letter-spacing: .08em; color: var(--color-bronze); margin: 0; }
  .sec-title { font-weight: 400; font-size: clamp(2.6rem, 5.5vw, 4.5rem); line-height: 1.04; letter-spacing: -.025em; margin: .3rem 0 0; }
  .accent-link { font-family: var(--font-mono); font-size: .8125rem; color: var(--color-cyan); text-decoration: none; }

  /* shared card visual */
  .card-link { display: flex; flex-direction: column; height: 100%; border: 1px solid var(--color-hairline); border-radius: 14px; overflow: hidden; background: var(--color-surface); text-decoration: none; }
  .cover { display: block; aspect-ratio: 16/10; background: radial-gradient(70% 90% at 30% 20%, rgb(111 202 214 / .12), transparent 60%), linear-gradient(140deg, #0e3236, #07191b); filter: grayscale(.6); }
  .card-body { display: flex; flex-direction: column; padding: 1.25rem 1.25rem 1.4rem; }
  .card-tags { font-family: var(--font-mono); font-size: .6875rem; letter-spacing: .1em; text-transform: uppercase; color: var(--color-cyan-muted); }
  .card-title { margin-top: .6rem; font-weight: 700; font-size: 1.25rem; color: var(--color-paper); }
  .card-id { font-family: var(--font-mono); font-size: .8125rem; color: var(--color-bronze); margin-right: .5rem; }
  .card-sub { margin-top: .2rem; font-size: .875rem; color: var(--color-ink-muted); }
  .card-blurb { margin-top: .9rem; font-size: .875rem; line-height: 1.5; color: var(--color-ink-faint); }
  ul { list-style: none; margin: 0; padding: 0; }

  /* ---- CURRENT: full-bleed rail, 30vw cards ---- */
  .v-current .rail-wrap { overflow-x: auto; }
  .v-current .rail { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(300px, 30vw); gap: 1.25rem; padding-inline: var(--space-gutter); }

  /* ---- OPTION A: contained, responsive fill (3-up on desktop, scroll on narrow) ---- */
  .v-a .rail-wrap { overflow-x: auto; }
  .v-a .rail { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(280px, 1fr); gap: 1.25rem; }

  /* ---- OPTION B: contained, smaller fixed cards (scroll-rail feel kept) ---- */
  .v-b .rail-wrap { overflow-x: auto; }
  .v-b .rail { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(300px, 22rem); gap: 1.25rem; }

  .panel { position: fixed; right: 1rem; bottom: 1rem; z-index: 50; background: rgb(9 58 62 / .95); border: 1px solid var(--color-hairline); border-radius: 12px; padding: .85rem 1rem; font-family: var(--font-mono); font-size: .72rem; backdrop-filter: blur(10px); }
  .panel h4 { margin: 0 0 .5rem; letter-spacing: .12em; text-transform: uppercase; color: var(--color-cyan-muted); }
  .panel label { display: block; padding: .25rem 0; cursor: pointer; }
  .panel .hint { color: var(--color-ink-faint); margin-top: .5rem; max-width: 230px; line-height: 1.5; }
  .tag { position: absolute; top: 1rem; right: var(--space-gutter); font-family: var(--font-mono); font-size: .7rem; color: var(--color-bronze); }
</style>
</head>
<body>

<div class="guide"><div class="col"><div></div></div></div>
<div class="guide-label">↕ dashed lines = the 1400px content column every other section aligns to</div>

<section class="section" id="sec">
  <div class="tag" id="tag">CURRENT</div>
  <div class="wrap head">
    <div>
      <p class="sec-index">02 — Projects</p>
      <h2 class="sec-title">Proof, before <em style="font-style:italic;color:var(--color-cyan)">theory.</em></h2>
    </div>
    <a class="accent-link" href="#">All case studies ↗</a>
  </div>

  <div id="cards-host">
    <!-- cards injected based on variant -->
  </div>
</section>

<div class="panel">
  <h4>Layout</h4>
  <label><input type="radio" name="v" value="current" checked> Current (bleed, 30vw — huge)</label>
  <label><input type="radio" name="v" value="a"> A · Contained fill (recommended)</label>
  <label><input type="radio" name="v" value="b"> B · Contained scroll-rail</label>
  <p class="hint">Watch the card edges vs the dashed guide. A/B sit inside it (aligned); Current bleeds past the right edge.</p>
</div>

<script>
  const projects = [
    {id:'01', tags:'ECOSTRESS · HVI', title:'Project Kolkata', sub:'Urban Heat Mitigation', blurb:'Street-scale heat diagnostics to ward-level intervention spec.'},
    {id:'02', tags:'VERRA VM0033 · MRV', title:'Mangrove Blue Carbon', sub:'Biochar Sequestration', blurb:'Soil-carbon-rigorous restoration accounting for premium credits.'},
    {id:'03', tags:'EPD · CBAM', title:'Sustainable Materials Trading', sub:'UAE–India Corridor', blurb:'Embodied-carbon dossiers and CBAM compliance for exporters.'},
  ];
  const cardHTML = (p) => `<li><a class="card-link" href="#"><span class="cover"></span><span class="card-body"><span class="card-tags">${p.tags}</span><span class="card-title"><span class="card-id">${p.id}</span>${p.title}</span><span class="card-sub">${p.sub}</span><span class="card-blurb">${p.blurb}</span></span></a></li>`;
  const rail = (cls, contained) => {
    const inner = `<div class="rail-wrap"><ul class="rail">${projects.map(cardHTML).join('')}</ul></div>`;
    return contained ? `<div class="${cls}"><div class="wrap">${inner}</div></div>` : `<div class="${cls}">${inner}</div>`;
  };
  const host = document.getElementById('cards-host');
  const tag = document.getElementById('tag');
  const render = (v) => {
    if (v === 'current') { host.innerHTML = rail('v-current', false); tag.textContent = 'CURRENT — bleeds + huge'; }
    if (v === 'a') { host.innerHTML = rail('v-a', true); tag.textContent = 'OPTION A — contained fill'; }
    if (v === 'b') { host.innerHTML = rail('v-b', true); tag.textContent = 'OPTION B — contained scroll-rail'; }
  };
  render('current');
  document.querySelectorAll('input[name="v"]').forEach(r => r.addEventListener('change', e => render(e.target.value)));
</script>
</body>
</html>
