<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Rocky River Scan — viewer</title>
<style>html,body{margin:0;height:100%;background:#050606;overflow:hidden}#gl{display:block;width:100%;height:100%}
.tag{position:fixed;left:14px;top:12px;z-index:2;font:11px ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:#6fcad6}</style>
</head><body>
<canvas id="gl"></canvas><div class="tag" id="tag">loading…</div>
<script type="importmap">{ "imports": {
  "three":"https://unpkg.com/three@0.184.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.184.0/examples/jsm/" }}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const canvas=document.getElementById('gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(2,devicePixelRatio||1));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
const scene=new THREE.Scene(); scene.background=new THREE.Color('#050606');
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,20000);
const controls=new OrbitControls(camera,canvas); controls.enableDamping=true;

const key=new THREE.DirectionalLight(0xcfe9ee,1.6); key.position.set(60,80,40); scene.add(key);
const rim=new THREE.DirectionalLight(0x6fcad6,0.7); rim.position.set(-50,30,-40); scene.add(rim);
scene.add(new THREE.HemisphereLight(0x9fb6bb,0x05080a,0.5));

const loader=new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);
const MV = new URLSearchParams(location.search).get('m') || 'river-2k.glb';
loader.load('../public/models/'+MV,(gltf)=>{
  const m=gltf.scene; scene.add(m);
  const box=new THREE.Box3().setFromObject(m); const c=box.getCenter(new THREE.Vector3()); const s=box.getSize(new THREE.Vector3());
  const r=Math.max(s.x,s.y,s.z);
  window.__c=c; window.__r=r; window.__m=m;
  setCam(0);
  document.getElementById('tag').textContent=`river_3_01 · ${Math.round(s.x)}×${Math.round(s.y)}×${Math.round(s.z)} · 12MB`;
  window.__ready=true;
},undefined,(e)=>{document.getElementById('tag').textContent='ERROR: '+e.message;});

function setCam(angleDeg, elev=0.42){
  const c=window.__c,r=window.__r; if(!c) return;
  const a=angleDeg*Math.PI/180; const d=r*1.05;
  camera.position.set(c.x+Math.sin(a)*d, c.y+r*elev, c.z+Math.cos(a)*d);
  controls.target.copy(c); camera.lookAt(c); controls.update();
}
window.__setCam=setCam;

addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);});
</script></body></html>
