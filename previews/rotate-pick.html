<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rotation pick — landmass spin into 01 · Delta</title>
<style>
  :root{ --cyan:#6fcad6; --base:#050606; --paper:#ecedf0; --faint:#5c7173; }
  *{ box-sizing:border-box; margin:0; } html,body{ height:100%; }
  body{ background:var(--base); color:var(--paper); font-family:ui-monospace,"SF Mono",monospace; overflow:hidden; }
  canvas{ position:fixed; inset:0; width:100%; height:100%; display:block; }
  #loading{ position:fixed; inset:0; display:grid; place-items:center; color:var(--faint); font-size:12px; letter-spacing:.18em; text-transform:uppercase; }
  .panel{ position:fixed; top:18px; left:18px; z-index:10; background:rgb(8 12 12 / .82); backdrop-filter:blur(8px);
    border:1px solid rgb(111 202 214 / .18); border-radius:12px; padding:16px 18px; width:300px; font-size:12px; }
  .panel h1{ font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--cyan); margin-bottom:4px; font-weight:600; }
  .panel p{ color:var(--faint); font-size:10.5px; line-height:1.5; margin-bottom:14px; letter-spacing:.02em; }
  .row{ display:flex; align-items:center; gap:8px; margin-bottom:11px; }
  .axes{ display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:14px; }
  .axes button{ appearance:none; cursor:pointer; background:rgb(255 255 255 / .03); color:var(--paper);
    border:1px solid rgb(111 202 214 / .2); border-radius:8px; padding:9px 4px; font:inherit; font-size:10px; letter-spacing:.04em; line-height:1.35; transition:.15s; }
  .axes button .lab{ display:block; font-size:11px; color:var(--cyan); margin-bottom:2px; letter-spacing:.1em; }
  .axes button.on{ background:rgb(111 202 214 / .16); border-color:var(--cyan); }
  .axes button:hover{ border-color:var(--cyan); }
  label{ color:var(--faint); letter-spacing:.04em; min-width:64px; }
  input[type=range]{ flex:1; accent-color:var(--cyan); }
  .val{ color:var(--cyan); min-width:42px; text-align:right; font-variant-numeric:tabular-nums; }
  .btns{ display:flex; gap:8px; margin-top:4px; }
  .btns button{ flex:1; appearance:none; cursor:pointer; background:rgb(111 202 214 / .12); color:var(--paper);
    border:1px solid rgb(111 202 214 / .3); border-radius:8px; padding:8px; font:inherit; font-size:10.5px; letter-spacing:.06em; transition:.15s; }
  .btns button:hover{ background:rgb(111 202 214 / .22); }
  .hint{ margin-top:12px; color:var(--faint); font-size:10px; line-height:1.5; border-top:1px solid rgb(111 202 214 / .12); padding-top:10px; }
  .hint b{ color:var(--paper); font-weight:400; }
</style>
</head>
<body>
<div id="loading">loading river scan…</div>
<div class="panel">
  <h1>Landmass rotation — pick the axis</h1>
  <p>Scrub <b>Progress</b> to preview the move (0 = hero, 1 = into 01). Flip the axis to see which "clockwise" you mean. Toggle direction if it spins the wrong way.</p>
  <div class="axes">
    <button data-axis="y" class="on"><span class="lab">Y</span>turntable<br>(spins flat)</button>
    <button data-axis="z"><span class="lab">Z</span>screen-roll<br>(frame tilts)</button>
    <button data-axis="x"><span class="lab">X</span>pitch<br>(tips fwd)</button>
    <button data-axis="yz"><span class="lab">Y+Z</span>turn + roll<br>(blend)</button>
  </div>
  <div class="row"><label>Progress</label><input id="prog" type="range" min="0" max="1" step="0.001" value="0"><span class="val" id="progV">0.00</span></div>
  <div class="row"><label>Max angle</label><input id="ang" type="range" min="0" max="90" step="1" value="45"><span class="val" id="angV">45°</span></div>
  <div class="row"><label>Dolly in</label><input id="dolly" type="range" min="0" max="12" step="0.1" value="9"><span class="val" id="dollyV">9.0</span></div>
  <div class="btns">
    <button id="dir">Direction: CW ↻</button>
    <button id="play">▶ Play</button>
  </div>
  <div class="hint">Current: <b id="read">Y · turntable · CW · 0°</b></div>
</div>

<script type="importmap">{ "imports":{
  "three":"https://unpkg.com/three@0.184.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.184.0/examples/jsm/" }}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const GLB = (location.protocol==='file:' ? 'http://localhost:8099' : '') + '/public/models/river-2k.glb';

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050606, 0.015);
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 1000);
const LOOK = new THREE.Vector3(0,-3.2,-7);
const CAM_BASE = new THREE.Vector3(0,6,16);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const key = new THREE.DirectionalLight(0xbfe2e8, 1.1); key.position.set(30,40,25); scene.add(key);
const rim = new THREE.DirectionalLight(0x6fcad6, 0.5); rim.position.set(-40,18,-30); scene.add(rim);
scene.add(new THREE.HemisphereLight(0x7d9aa0, 0x04070a, 0.35));

// pivot group so the model spins around its own visual centre (in place), like the hero
const pivot = new THREE.Group(); pivot.position.set(0,-3.5,-5); scene.add(pivot);

const loader = new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);
let river;
loader.load(GLB,(g)=>{
  river = g.scene;
  river.traverse(o=>{ if(o.isMesh) o.frustumCulled=false; });
  const box=new THREE.Box3().setFromObject(river); const c=box.getCenter(new THREE.Vector3()); const s=box.getSize(new THREE.Vector3());
  const scl=120/s.x; river.scale.setScalar(scl);
  river.position.set(-c.x*scl, -c.y*scl, -c.z*scl);   // centre at the pivot origin
  pivot.add(river);
  document.getElementById('loading').remove();
}, undefined, (e)=>{ document.getElementById('loading').textContent='load failed: '+(e?.message||e); });

// ── controls ──
let axis='y', dir=-1, playing=false, playT=0;   // dir -1 ≈ clockwise for Y/Z from this camera
const prog=document.getElementById('prog'), ang=document.getElementById('ang'), dollyR=document.getElementById('dolly');
const progV=document.getElementById('progV'), angV=document.getElementById('angV'), dollyV=document.getElementById('dollyV');
const read=document.getElementById('read'), dirBtn=document.getElementById('dir'), playBtn=document.getElementById('play');
const AXNAME={y:'turntable',z:'screen-roll',x:'pitch',yz:'turn+roll'};

document.querySelectorAll('.axes button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.axes button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); axis=b.dataset.axis;
});
dirBtn.onclick=()=>{ dir*=-1; dirBtn.textContent = 'Direction: ' + (dir<0?'CW ↻':'CCW ↺'); };
playBtn.onclick=()=>{ playing=!playing; playBtn.textContent = playing?'❚❚ Pause':'▶ Play'; if(playing) playT=parseFloat(prog.value); };

function frame(){
  requestAnimationFrame(frame);
  if(playing){ playT=(playT+0.006)%1; prog.value=playT.toFixed(3); }
  const p=parseFloat(prog.value), maxA=parseFloat(ang.value)*Math.PI/180, dollyAmt=parseFloat(dollyR.value);
  progV.textContent=p.toFixed(2); angV.textContent=ang.value+'°'; dollyV.textContent=parseFloat(dollyR.value).toFixed(1);
  read.textContent = `${axis.toUpperCase()} · ${AXNAME[axis]} · ${dir<0?'CW':'CCW'} · ${Math.round(p*parseFloat(ang.value))}°`;
  if(river){
    pivot.rotation.set(0,0,0);
    if(axis==='yz'){ pivot.rotation.y = dir*p*maxA; pivot.rotation.z = dir*p*maxA*0.5; }
    else pivot.rotation[axis] = dir * p * maxA;
  }
  // dolly the camera closer with progress (the "gets closer" part)
  camera.position.set(CAM_BASE.x, CAM_BASE.y, CAM_BASE.z - p*dollyAmt);
  camera.lookAt(LOOK);
  renderer.render(scene,camera);
}
frame();
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
</script>
</body>
</html>
