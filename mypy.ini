# Type-checking for the data-pipeline scripts under scripts/.
#
# A dedicated mypy.ini rather than pyproject.toml: this is a Node-first repo and
# a pyproject.toml at the root reads as "this is a Python package", which it is
# not. The scripts are a pipeline, not a distribution.
#
# Run:  python3 -m mypy          (files= below means no argument is needed, so
#                                 nobody can check a subset and declare victory)
# Deps: pip install -r requirements-dev.txt

[mypy]
python_version = 3.12
files = scripts
strict = True

# Beyond --strict. Each of these has caught something in this repo or guards a
# failure mode it has already had.
warn_unreachable = True
enable_error_code = redundant-expr, possibly-undefined, truthy-bool, ignore-without-code
pretty = True

# NO ignore_missing_imports, anywhere.
#
# rasterio and scipy ship no py.typed marker, and the tempting fix is to silence
# them per-module. Do not. `ignore_missing_imports` turns an entire library into
# Any, and mypy does NOT flag calls on Any — so a typo'd rasterio method would
# pass silently. Both libraries now have stub packages; they are pinned in
# requirements-dev.txt. Installing them removed 15 errors and surfaced 4 real
# ones, including a None reaching transform_bounds.
#
# If a future dependency genuinely has no stubs, that is a dependency decision
# made once and recorded in requirements-dev.txt, not a silent hole here.

# Explicit `Any` is needed at the JSON boundary — `cast(SomeFile, json.load(fh))`
# — so disallow_any_explicit stays off. Everything else strict covers is on.
